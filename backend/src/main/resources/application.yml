server:
  port: 8080

spring:
  application:
    name: inventory-forecasting-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/inventory_forecasting?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}

  mail:
      resend-api-key: ${RESEND_API_KEY:}
      from: ${MAIL_FROM:Obstocker <onboarding@resend.dev>}
      app-base-url: ${APP_BASE_URL:http://localhost:3000}

  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.hackinmotion.inventory: INFO
    org.springframework.security: WARN